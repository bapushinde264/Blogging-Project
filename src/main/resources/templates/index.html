<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Blog Posts</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <!-- Page Heading -->
    <h2 class="text-center mb-4">All Blog Posts</h2>
    <!-- New Post Button -->
    <div class="d-flex justify-content-end mb-3">
        <a href="/new" class="btn btn-success">
            + New Post
        </a>
    </div>
    <!-- Edit/Delete Section -->
    <div class="card p-3 mb-4">
        <h5>Update or Delete a Post by ID</h5>
        <div class="row g-2">
            <!-- Input Field -->
            <div class="col-md-4">
                <input type="number"
                       id="postIdInput"
                       class="form-control"
                       placeholder="Enter Post ID">
            </div>
            <!-- Edit Button -->
            <div class="col-md-2">
                <button onclick="editPost()"
                        class="btn btn-primary w-100">
                    Edit Post
                </button>
            </div>

            <!-- Delete Button -->
            <div class="col-md-2">

                <button onclick="deletePost()"
                        class="btn btn-danger w-100">
                    Delete Post
                </button>
            </div>
        </div>
    </div>

    <!-- Blog Table -->
    <table class="table table-bordered table-striped">

        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Content</th>
        </tr>
        </thead>
        <tbody>
        <!-- Thymeleaf Loop -->
        <tr th:each="post : ${listPosts}">

            <td th:text="${post.id}">1</td>

            <td th:text="${post.title}">
                Post Title
            </td>

            <td th:text="${post.author}">
                Author
            </td>

            <td th:text="${post.content}">
                Content
            </td>

        </tr>

        </tbody>

    </table>

</div>

<!-- JavaScript -->
<script>

    function editPost() {

        const id = document.getElementById("postIdInput").value;

        if (id) {

            window.location.href = "/edit/" + id;

        } else {

            alert("Please enter a valid Post ID.");

        }

    }

    function deletePost() {

        const id = document.getElementById("postIdInput").value;

        if (id) {

          const confirmDelete =
                confirm("Are you sure you want to delete post ID " + id + "?");

            if (confirmDelete) {
          window.location.href = "/delete/" + id;
        }

        } else {
            alert("Please enter a valid Post ID.");
      }
    }
</script>
</body>
</html>
